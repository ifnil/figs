# tiramisu — ported from hypr/hosts/tiramisu.lua
# (env exports for the openrc dbus fix live in scripts/start-sway)

# laptop. sits right of the portable monitor; keep every output at x,y >= 0 —
# xwayland maps negative positions outside the x root window, and chromium/cef
# clients (spotify) then drop clicks on that output.
output eDP-1 mode 1920x1200@60Hz position 1920 0 scale 1

# portable monitor
output HDMI-A-1 mode     1920x1080@60Hz position 0 0 scale 1
output DP-3     mode     1920x1080@60Hz position 0 0 scale 1
output DP-1     position 0          0        scale 1

workspace 1 output eDP-1


# artix. the session bus, pipewire and wireplumber are openrc *user* services
# (/etc/user/init.d/*, from dbus-openrc / pipewire-openrc / wireplumber-openrc);
# nothing else on this box brings up a user session, so start them here. the
# activation environment update has to follow `dbus start` — the earlier call in
# the main config runs before this file and finds no bus to talk to.
exec rc-service --user dbus start; dbus-update-activation-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP; rc-service --user pipewire start; rc-service --user wireplumber start

exec ~/.config/sway/scripts/xdg-portal-sway
