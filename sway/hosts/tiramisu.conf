# tiramisu — ported from hypr/hosts/tiramisu.lua
# (env exports for the openrc dbus fix live in scripts/start-sway)

output * mode 1920x1200@60Hz position 0 0 scale 1

exec gentoo-pipewire-launcher
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec ~/.config/sway/scripts/xdg-portal-sway
