[module/battery]
type = internal/battery
full-at = 98
time-format = %H:%M

label-full = "%percentage%"
label-full-foreground = ${colors.dark}
label-full-background = ${colors.blue}
label-full-padding = 1

label-charging = "%percentage%"
label-charging-foreground = ${colors.dark}
label-charging-background = ${colors.orange}
label-charging-padding = 1

label-discharging = "%percentage%"
label-discharging-foreground = ${colors.dark}
label-discharging-background = ${colors.green}
label-discharging-padding = 1

label-low = "%percentage%"
label-low-foreground = ${colors.dark}
label-low-background = ${colors.red}
label-low-padding = 1
