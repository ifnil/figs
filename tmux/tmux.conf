# ~/figs/tmux/tmux.conf

## binds

bind R   source-file  '~/.tmux.conf'
bind c   new-window   -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

bind -n M-Left  previous-window
bind -n M-Right next-window

# Press Prefix + Z to source .zshrc in all panes of the current session
# bind Z run 'panes=$(tmux list-panes -s -F "##{pane_id}"); \
#             for pane in $panes; do \
#               tmux send-keys -t "$pane" "exec zsh" Enter; \
#             done'

setw -g base-index          1
set  -g base-index          1
set  -g mouse               on
set  -g renumber-windows    on
set  -g status-right-length 100

set -g pane-active-border-style "fg=#489c7a,bg=default"
set -g pane-border-style        "fg=#489c7a,bg=default"

## plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-battery'

## supposedly to help with vim mode switching delay
set -s escape-time 0

## restore
set -g @resurrect-save         'S'
set -g @resurrect-restore      'R'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

set -g @continuum-save-interval '60'

## battery
set -g @batt_color_status_primary_charged     'foreground'
set -g @batt_color_status_primary_charging    'foreground'
set -g @batt_color_status_primary_discharging 'foreground'
set -g @batt_color_status_primary_attached    'foreground'
set -g @batt_color_status_primary_unknown     'foreground'

set -g @batt_icon_charge_tier1    ''
set -g @batt_icon_charge_tier2    ''
set -g @batt_icon_charge_tier3    ''
set -g @batt_icon_charge_tier4    ''
set -g @batt_icon_charge_tier5    ''
set -g @batt_icon_charge_tier6    ''
set -g @batt_icon_charge_tier7    ''
set -g @batt_icon_charge_tier8    ''

set -g @batt_icon_status_charging '󱐋'
set -g @batt_icon_status_charged  '󱐋'
set -g @batt_icon_status_attached '󱐋'

run-shell "tmux set-environment -g VIA_SSH     \$(~/.config/tmux/scripts/ssh.sh)"
run-shell "tmux set-environment -g HAS_BATTERY \$(~/.config/tmux/scripts/has_battery.sh)"

## status (ported from minimal-tmux-status)
# Tweakables — values that are themselves formats (e.g. #{VIA_SSH}) get
# re-expanded via #{E:#{@name}} when used below.
set -g @bar_bg        "#{VIA_SSH}"
set -g @bar_fg        "#000000"
set -g @bar_indicator "  · · ·  "
set -g @bar_zoom      " 󰊓 "

# Window label (ssh panes show remote host, otherwise window name).
set -g @bar_win       "#I:#{?#{m:ssh*,#{pane_current_command}},#(ps -t #{pane_tty} -o args= | grep '^ssh ' | sed 's/.* //'),#W}"

set -g status-position bottom
set -g status-justify  left
set -g status-style    "bg=default,fg=default"

# left: indicator highlighted with @bar_bg while prefix is held.
set -g status-left-length 50
set -g status-left "#[bg=default,fg=default,bold]#{?client_prefix,,#{@bar_indicator}}#[bg=#{E:#{@bar_bg}},fg=#{@bar_fg},bold]#{?client_prefix,#{@bar_indicator},}#[bg=default,fg=default,bold]"

set -g status-right "#{?HAS_BATTERY,#{battery_color_status_bg}#{battery_icon} #{battery_percentage}#[default]  ,}%d %b %Y  %H:%M  #S "

# window list: current window painted with @bar_bg.
set -g window-status-format         " #{E:#{@bar_win}} "
set -g window-status-current-format "#[bg=#{E:#{@bar_bg}},fg=#{@bar_fg},bold] #{E:#{@bar_win}}#{?window_zoomed_flag,#{@bar_zoom}, } "

# install tpm if it's not already
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
